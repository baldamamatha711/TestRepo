<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🎬 CineMagic · Movie Ticket Booking</title>
    <!-- Google Fonts & Font Awesome for clean look -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: linear-gradient(145deg, #0b0e1a 0%, #1a1f2f 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }

        /* Main card */
        .booking-container {
            max-width: 1200px;
            width: 100%;
            background: rgba(18, 23, 38, 0.9);
            backdrop-filter: blur(8px);
            border-radius: 2.5rem;
            padding: 2rem;
            box-shadow: 0 30px 50px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        /* header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo h1 {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(130deg, #f9d71c, #f5a623);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo i {
            background: #f9d71c;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            font-size: 2rem;
        }

        .location {
            background: rgba(255, 255, 255, 0.06);
            padding: 0.6rem 1.2rem;
            border-radius: 60px;
            display: flex;
            align-items: center;
            gap: 8px;
            color: #cfd9e6;
            border: 1px solid rgba(255, 255, 255, 0.1);
            font-weight: 500;
            cursor: default;
            transition: 0.2s;
        }

        .location i {
            color: #f9d71c;
        }

        /* movie list row */
        .movie-showcase {
            display: flex;
            gap: 1.5rem;
            overflow-x: auto;
            padding: 0.5rem 0.2rem 1.5rem;
            margin-bottom: 1rem;
            scrollbar-width: thin;
            scrollbar-color: #f9d71c #1e2437;
        }

        .movie-showcase::-webkit-scrollbar {
            height: 6px;
        }

        .movie-showcase::-webkit-scrollbar-track {
            background: #1e2437;
            border-radius: 10px;
        }

        .movie-showcase::-webkit-scrollbar-thumb {
            background: #f9d71c;
            border-radius: 10px;
        }

        .movie-card {
            min-width: 170px;
            background: #1b2132;
            border-radius: 1.5rem;
            padding: 1rem 1rem 1.2rem;
            cursor: pointer;
            transition: all 0.25s ease;
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.4);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .movie-card:hover {
            transform: translateY(-6px);
            border-color: rgba(249, 215, 28, 0.5);
            box-shadow: 0 16px 28px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(249, 215, 28, 0.3);
        }

        .movie-card.selected {
            border: 2px solid #f9d71c;
            background: #1e253b;
            box-shadow: 0 0 0 3px rgba(249, 215, 28, 0.2), 0 16px 28px #00000080;
        }

        .poster {
            width: 120px;
            height: 120px;
            border-radius: 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3.8rem;
            margin-bottom: 0.8rem;
            background: linear-gradient(145deg, #2b3247, #1a1f2e);
            box-shadow: inset 0 -2px 8px rgba(0,0,0,0.6), 0 8px 12px #00000030;
            color: #f9d71c;
        }

        .movie-title {
            font-weight: 700;
            font-size: 1.05rem;
            color: #f0f4ff;
            text-align: center;
            margin-bottom: 4px;
            letter-spacing: -0.2px;
        }

        .movie-meta {
            font-size: 0.75rem;
            color: #a0afc0;
            display: flex;
            gap: 8px;
            margin-bottom: 6px;
        }

        .rating {
            color: #f9d71c;
            font-weight: 600;
            font-size: 0.75rem;
            display: flex;
            align-items: center;
            gap: 4px;
            background: rgba(249, 215, 28, 0.1);
            padding: 0.2rem 0.6rem;
            border-radius: 30px;
        }

        /* main booking area */
        .booking-panel {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 2rem;
            margin-top: 0.5rem;
        }

        @media (max-width: 750px) {
            .booking-panel {
                grid-template-columns: 1fr;
                gap: 1.5rem;
            }
        }

        /* screen and seats */
        .screen-area {
            background: #0f1320;
            border-radius: 2rem;
            padding: 1.5rem 1.5rem 1.8rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }

        .screen-label {
            text-align: center;
            color: #a0afc0;
            font-size: 0.8rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
        }

        .screen-label i {
            color: #f9d71c;
            font-size: 1rem;
        }

        .curved-screen {
            width: 90%;
            height: 12px;
            background: linear-gradient(to bottom, #e0e6f0, #8b9bb5);
            margin: 0 auto 1.8rem;
            border-radius: 0 0 50% 50% / 0 0 100% 100%;
            box-shadow: 0 10px 20px -5px #f9d71c60, 0 0 15px #ffffff20;
            transform: perspective(400px) rotateX(2deg);
        }

        .seats-grid {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 8px 6px;
            justify-content: center;
            margin: 0 auto 1.5rem;
            max-width: 500px;
        }

        .seat {
            aspect-ratio: 1 / 1;
            background: #2c3348;
            border-radius: 8px 8px 4px 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            font-weight: 600;
            color: #d5deed;
            cursor: pointer;
            transition: 0.15s ease;
            border: 1px solid #3d455e;
            box-shadow: 0 3px 0 #10131f;
            user-select: none;
        }

        .seat:hover:not(.occupied) {
            background: #4a5578;
            transform: scale(1.02);
            border-color: #f9d71c80;
        }

        .seat.selected {
            background: #f9d71c;
            color: #10131f;
            border-color: #f9d71c;
            box-shadow: 0 0 12px #f9d71caa, 0 3px 0 #b38f1a;
            font-weight: 700;
            transform: scale(1.02);
        }

        .seat.occupied {
            background: #1a1e2c;
            color: #3f475e;
            cursor: not-allowed;
            border-color: #23283a;
            box-shadow: none;
            opacity: 0.6;
        }

        .seat.occupied i {
            font-size: 0.6rem;
            color: #3f475e;
        }

        .row-labels {
            display: grid;
            grid-template-columns: repeat(10, 1fr);
            gap: 6px;
            max-width: 500px;
            margin: 0 auto 0.5rem;
            padding: 0 2px;
        }

        .row-labels span {
            text-align: center;
            font-size: 0.65rem;
            color: #7788a0;
            font-weight: 600;
        }

        .legend {
            display: flex;
            justify-content: center;
            gap: 2rem;
            margin-top: 1.5rem;
            font-size: 0.75rem;
            color: #b7c3d6;
            flex-wrap: wrap;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .legend-box {
            width: 18px;
            height: 18px;
            border-radius: 6px;
            background: #2c3348;
            border: 1px solid #3d455e;
        }

        .legend-box.selected {
            background: #f9d71c;
            border-color: #f9d71c;
        }

        .legend-box.occupied {
            background: #1a1e2c;
            border-color: #23283a;
        }

        /* summary card */
        .summary-card {
            background: #121724;
            border-radius: 2rem;
            padding: 1.8rem 1.6rem;
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            flex-direction: column;
            height: fit-content;
            box-shadow: 0 10px 25px #00000040;
        }

        .summary-card h2 {
            color: #eef3ff;
            font-weight: 600;
            font-size: 1.5rem;
            margin-bottom: 1.2rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .summary-card h2 i {
            color: #f9d71c;
        }

        .selected-movie-info {
            background: #1b2132;
            border-radius: 1.2rem;
            padding: 1rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            border-left: 4px solid #f9d71c;
        }

        .selected-movie-info .mini-poster {
            font-size: 2.5rem;
            width: 50px;
            text-align: center;
        }

        .selected-movie-info .details h4 {
            color: #f0f4ff;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .selected-movie-info .details p {
            color: #a0afc0;
            font-size: 0.75rem;
            margin-top: 4px;
        }

        .order-line {
            display: flex;
            justify-content: space-between;
            padding: 0.6rem 0;
            border-bottom: 1px solid #262e41;
            color: #cbd5e6;
            font-size: 0.9rem;
        }

        .order-line.total {
            border-bottom: none;
            font-weight: 700;
            font-size: 1.3rem;
            color: #f9d71c;
            margin-top: 0.8rem;
            padding-top: 1rem;
            border-top: 2px dashed #2e374f;
        }

        .seat-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin: 0.5rem 0 0.8rem;
        }

        .pill {
            background: #f9d71c20;
            border: 1px solid #f9d71c60;
            color: #f9d71c;
            border-radius: 40px;
            padding: 0.2rem 0.8rem;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .no-seats {
            color: #7a879b;
            font-style: italic;
            font-size: 0.85rem;
        }

        .book-btn {
            background: linear-gradient(145deg, #f9d71c, #e6b800);
            border: none;
            padding: 1rem;
            border-radius: 60px;
            font-weight: 700;
            font-size: 1.1rem;
            color: #0b0e1a;
            margin-top: 1.8rem;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 12px 25px -8px #f9d71c;
            letter-spacing: -0.2px;
            border: 1px solid #ffe570;
        }

        .book-btn:hover:not(:disabled) {
            background: #ffdf2e;
            transform: scale(1.02);
            box-shadow: 0 16px 28px -6px #f9d71c;
        }

        .book-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            box-shadow: none;
            filter: grayscale(0.5);
        }

        .notification {
            margin-top: 1rem;
            background: #1e2a3a;
            border-radius: 60px;
            padding: 0.7rem 1rem;
            font-size: 0.85rem;
            color: #b7e1cd;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            border: 1px solid #3f5c6b;
            transition: 0.3s;
            visibility: hidden;
            opacity: 0;
        }

        .notification.show {
            visibility: visible;
            opacity: 1;
        }

        .notification i {
            color: #6fcf97;
        }

        .footer-note {
            text-align: center;
            color: #5e6b82;
            font-size: 0.7rem;
            margin-top: 1.5rem;
        }
    </style>
</head>
<body>
<div class="booking-container">
    <!-- Header -->
    <div class="header">
        <div class="logo">
            <h1><i class="fas fa-film"></i> CineMagic</h1>
        </div>
        <div class="location">
            <i class="fas fa-map-marker-alt"></i> Downtown · IMAX
        </div>
    </div>

    <!-- Movie selection row -->
    <div class="movie-showcase" id="movieShowcase">
        <!-- Movie cards injected by JS -->
    </div>

    <!-- Main booking area -->
    <div class="booking-panel">
        <!-- Seat selection side -->
        <div class="screen-area">
            <div class="screen-label">
                <i class="fas fa-tv"></i> SCREEN <i class="fas fa-tv"></i>
            </div>
            <div class="curved-screen"></div>
            <!-- row letters -->
            <div class="row-labels" id="rowLabels"></div>
            <!-- seats grid -->
            <div class="seats-grid" id="seatsGrid"></div>

            <!-- legend -->
            <div class="legend">
                <div class="legend-item"><div class="legend-box"></div> Available</div>
                <div class="legend-item"><div class="legend-box selected"></div> Selected</div>
                <div class="legend-item"><div class="legend-box occupied"></div> Occupied</div>
            </div>
        </div>

        <!-- Summary side -->
        <div class="summary-card">
            <h2><i class="fas fa-ticket-alt"></i> Your order</h2>
            <div class="selected-movie-info" id="selectedMovieInfo">
                <!-- filled by js -->
            </div>
            <div class="order-line">
                <span>Seats</span>
                <span id="seatCount">0</span>
            </div>
            <div class="seat-pills" id="seatPills">
                <span class="no-seats">No seats selected</span>
            </div>
            <div class="order-line">
                <span>Price per ticket</span>
                <span id="pricePerTicket">$12.50</span>
            </div>
            <div class="order-line total">
                <span>Total</span>
                <span id="totalPrice">$0.00</span>
            </div>
            <button class="book-btn" id="bookBtn" disabled>
                <i class="fas fa-credit-card"></i> Book now
            </button>
            <div class="notification" id="notification">
                <i class="fas fa-check-circle"></i> <span id="notifMessage">Booking confirmed!</span>
            </div>
        </div>
    </div>
    <div class="footer-note">
        ⚡ Click on seats to select · Up to 6 tickets per order
    </div>
</div>

<script>
    (function() {
        // ---------- Data ----------
        const movies = [
            { id: 0, title: 'Dune: Part Two', emoji: '🏜️', rating: '8.8', genre: 'Sci-Fi', price: 14.50 },
            { id: 1, title: 'Oppenheimer', emoji: '⚛️', rating: '8.9', genre: 'Drama', price: 13.00 },
            { id: 2, title: 'Barbie', emoji: '💖', rating: '7.5', genre: 'Comedy', price: 11.50 },
            { id: 3, title: 'The Batman', emoji: '🦇', rating: '8.3', genre: 'Action', price: 12.00 },
            { id: 4, title: 'Interstellar', emoji: '🚀', rating: '8.7', genre: 'Sci-Fi', price: 15.00 },
            { id: 5, title: 'Poor Things', emoji: '🧠', rating: '8.0', genre: 'Fantasy', price: 12.50 }
        ];

        // Global state
        let currentMovieId = 0;          // Dune by default
        let selectedSeats = [];          // array of { row, col } ; row 0-4, col 0-9
        const ROWS = 5;
        const COLS = 10;

        // Occupied seats (predefined, random-looking but fixed)
        const occupiedSeats = new Set([
            '0-3', '0-4', '0-5', '0-6', '0-7',
            '1-1', '1-2', '1-8', '1-9',
            '2-0', '2-5', '2-6', '2-7', '2-9',
            '3-2', '3-3', '3-4', '3-8',
            '4-0', '4-1', '4-6', '4-7', '4-9'
        ]);

        // DOM elements
        const movieShowcase = document.getElementById('movieShowcase');
        const rowLabels = document.getElementById('rowLabels');
        const seatsGrid = document.getElementById('seatsGrid');
        const selectedMovieInfo = document.getElementById('selectedMovieInfo');
        const seatCountSpan = document.getElementById('seatCount');
        const seatPills = document.getElementById('seatPills');
        const pricePerTicketSpan = document.getElementById('pricePerTicket');
        const totalPriceSpan = document.getElementById('totalPrice');
        const bookBtn = document.getElementById('bookBtn');
        const notification = document.getElementById('notification');
        const notifMessage = document.getElementById('notifMessage');

        // ---------- Render movie cards ----------
        function renderMovies() {
            movieShowcase.innerHTML = '';
            movies.forEach(movie => {
                const card = document.createElement('div');
                card.className = `movie-card ${movie.id === currentMovieId ? 'selected' : ''}`;
                card.dataset.id = movie.id;
                card.innerHTML = `
                    <div class="poster">${movie.emoji}</div>
                    <div class="movie-title">${movie.title}</div>
                    <div class="movie-meta">
                        <span>${movie.genre}</span>
                        <span class="rating"><i class="fas fa-star"></i> ${movie.rating}</span>
                    </div>
                `;
                card.addEventListener('click', () => {
                    if (currentMovieId !== movie.id) {
                        currentMovieId = movie.id;
                        // Deselect all seats when movie changes (clear selection)
                        selectedSeats = [];
                        renderMovies();
                        renderSeats();
                        updateSummary();
                    }
                });
                movieShowcase.appendChild(card);
            });
        }

        // ---------- Generate row labels (A-E) ----------
        function renderRowLabels() {
            rowLabels.innerHTML = '';
            const letters = ['A', 'B', 'C', 'D', 'E'];
            letters.forEach(letter => {
                const span = document.createElement('span');
                span.textContent = letter;
                rowLabels.appendChild(span);
            });
        }

        // ---------- Render seats grid ----------
        function renderSeats() {
            seatsGrid.innerHTML = '';
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const seat = document.createElement('div');
                    seat.className = 'seat';
                    const seatKey = `${r}-${c}`;
                    const isOccupied = occupiedSeats.has(seatKey);
                    const isSelected = selectedSeats.some(s => s.row === r && s.col === c);

                    if (isOccupied) {
                        seat.classList.add('occupied');
                        seat.innerHTML = '<i class="fas fa-user"></i>';
                    } else if (isSelected) {
                        seat.classList.add('selected');
                        seat.textContent = '✓';
                    } else {
                        // show seat number (column+1) with row letter small? just col number
                        seat.textContent = c + 1;
                    }

                    seat.dataset.row = r;
                    seat.dataset.col = c;

                    if (!isOccupied) {
                        seat.addEventListener('click', (e) => {
                            e.stopPropagation();
                            toggleSeat(r, c);
                        });
                    }
                    seatsGrid.appendChild(seat);
                }
            }
        }

        // ---------- Toggle seat selection (max 6 seats) ----------
        function toggleSeat(row, col) {
            const seatKey = `${row}-${col}`;
            if (occupiedSeats.has(seatKey)) return; // occupied not selectable

            const index = selectedSeats.findIndex(s => s.row === row && s.col === col);
            if (index !== -1) {
                // Deselect
                selectedSeats.splice(index, 1);
            } else {
                // Select if under limit
                if (selectedSeats.length >= 6) {
                    showNotification('You can select up to 6 seats only.', 'warning');
                    return;
                }
                selectedSeats.push({ row, col });
            }

            // Re-render seats and summary
            renderSeats();
            updateSummary();
        }

        // ---------- Update summary panel ----------
        function updateSummary() {
            const movie = movies[currentMovieId];
            // Selected movie info
            selectedMovieInfo.innerHTML = `
                <div class="mini-poster">${movie.emoji}</div>
                <div class="details">
                    <h4>${movie.title}</h4>
                    <p>${movie.genre} · ⭐ ${movie.rating} · IMAX</p>
                </div>
            `;

            // Update seat count & pills
            const count = selectedSeats.length;
            seatCountSpan.textContent = count;

            if (count === 0) {
                seatPills.innerHTML = '<span class="no-seats">No seats selected</span>';
            } else {
                // sort seats by row then col for readability
                const sorted = [...selectedSeats].sort((a, b) => a.row - b.row || a.col - b.col);
                const rowLetters = ['A', 'B', 'C', 'D', 'E'];
                seatPills.innerHTML = sorted.map(s => {
                    const rowLetter = rowLetters[s.row];
                    const seatNum = s.col + 1;
                    return `<span class="pill">${rowLetter}${seatNum}</span>`;
                }).join('');
            }

            // Price
            const pricePerTicket = movie.price;
            const total = pricePerTicket * count;
            pricePerTicketSpan.textContent = `$${pricePerTicket.toFixed(2)}`;
            totalPriceSpan.textContent = `$${total.toFixed(2)}`;

            // Enable/disable book button
            bookBtn.disabled = count === 0;
        }

        // ---------- Show notification (with timeout) ----------
        let notifTimeout = null;
        function showNotification(message, type = 'success') {
            if (notifTimeout) clearTimeout(notifTimeout);
            notifMessage.textContent = message;
            notification.classList.add('show');
            // change icon if warning
            const icon = notification.querySelector('i');
            if (type === 'warning') {
                icon.className = 'fas fa-exclamation-triangle';
                icon.style.color = '#f9d71c';
                notification.style.borderColor = '#f9d71c';
            } else {
                icon.className = 'fas fa-check-circle';
                icon.style.color = '#6fcf97';
                notification.style.borderColor = '#3f5c6b';
            }
            notifTimeout = setTimeout(() => {
                notification.classList.remove('show');
            }, 2500);
        }

        // ---------- Book button action ----------
        function handleBooking() {
            if (selectedSeats.length === 0) return;

            // Simulate booking (success message, clear seats)
            const movie = movies[currentMovieId];
            const totalSeats = selectedSeats.length;
            const totalAmount = (movie.price * totalSeats).toFixed(2);

            // Show confirmation notification
            showNotification(`✅ ${totalSeats} ticket${totalSeats > 1 ? 's' : ''} booked for "${movie.title}" · $${totalAmount}`, 'success');

            // Clear selections after booking
            selectedSeats = [];
            renderSeats();
            updateSummary();
        }

        // ---------- Initialise ----------
        function init() {
            renderMovies();
            renderRowLabels();
            renderSeats();
            updateSummary();

            bookBtn.addEventListener('click', handleBooking);
        }

        init();
    })();
</script>
</body>
</html>
